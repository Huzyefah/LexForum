[project]
name = "lexforum"
version = "1.0.0"
description = "Pakistan-focused multi-agent legal research and adversarial case analysis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "langgraph>=1.0,<2", "google-genai>=1.0,<2",
  "python-multipart>=0.0.20", "pypdf>=5,<7", "python-docx>=1.1,<2", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

